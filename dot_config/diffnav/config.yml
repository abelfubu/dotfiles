# diffnav configuration file
# Docs: https://github.com/dlvhdr/diffnav

ui:
  # Width of the file tree sidebar (default: 30)
  fileTreeWidth: 60

  # Width of the tree when searching (default: 50)
  searchTreeWidth: 60

  # Show file tree panel
  showFileTree: true

  # Side-by-side diff view
  sideBySide: true

  # Show +/-/~ stats next to files
  showDiffStats: true

  # Color filenames by git status
  colorFileNames: true

  # How many folder levels to open on start (-1 = all, 0 = none)
  startFoldersOpenDepth: -1
